  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="A composable framework for portable, accessible, state-driven HTML tools." />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://reggi.github.io/html-framework/" />
    <meta property="og:title" content="HTML Tool Framework" />
    <meta property="og:description" content="Build portable HTML tools with projects, Source, State JSON, commands, and hookable controls." />
    <meta property="og:image" content="https://reggi.github.io/html-framework/social-card.svg" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/src/core/styles.css" />
    <link rel="stylesheet" href="/src/app/checklist/styles.css" />
    <title>HTML Tool Framework</title>
    <script>
      (() => {
        const preference = localStorage.getItem("html-tool-theme") || "system";
        const dark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.dataset.theme = "dark";
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.js"></script>
  </body>
