name: Update from HTML framework template

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: knitto-template-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run template:update
      - run: npm install
      - run: npm test
      - run: npm run build

      - name: Create or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/knitto-template-update
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Template is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add --all
          git commit -m "chore: update from html framework template"
          git push --force-with-lease origin "HEAD:$BRANCH"

          if ! gh pr list --head "$BRANCH" --state open --json number --jq 'length > 0' | grep -q true; then
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$BRANCH" \
              --title "chore: update from HTML framework template" \
              --body "Automated update generated by Knitto. Review the managed core changes and validation results before merging."
          fi
